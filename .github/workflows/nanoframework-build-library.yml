name: Build, test, and publish

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the id: required checks are `pipeline / build`, `/ package-lock`, `/ packages-updated`.
  pipeline:
    uses: ccswe-apps/actions/.github/workflows/nanoframework-build-library.yml@master
    with:
      solution: 'CCSWE.nanoFramework.sln'
      discover-dependents: |
        CoryCharlton
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
